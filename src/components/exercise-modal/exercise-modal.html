<dialog
  class="exercise-modal ui-theme ui-theme--dark"
  data-exercise-modal
  aria-label="Exercise details"
>
  <button
    class="exercise-modal__close"
    type="button"
    aria-label="Close"
    data-modal-close
  >
    <picture>
      <source media="(min-width: 768px)" srcset="./images/icons/close.svg" />
      <img src="./images/icons/close-mobile.svg" alt="" />
    </picture>
  </button>

  <div class="exercise-modal__panel">
    <div class="exercise-modal__status" data-modal-status role="status">
      <p class="exercise-modal__status-text" data-modal-status-text></p>
      <button
        class="ui-button ui-button--outline"
        type="button"
        data-modal-retry
        hidden
      >
        Try again
      </button>
    </div>

    <div class="exercise-modal__content" data-modal-content hidden>
      <div class="exercise-modal__media" data-modal-media>
        <img
          class="exercise-modal__gif"
          data-modal-gif
          src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
          alt=""
          width="270"
          height="259"
        />
      </div>

      <div class="exercise-modal__info">
        <h2 class="exercise-modal__title" data-modal-title>Exercise</h2>

        <p class="exercise-modal__rating">
          <span class="visually-hidden">Rating:</span>
          <span data-modal-rating></span>
          <span
            class="exercise-modal__stars"
            data-modal-stars
            aria-hidden="true"
          ></span>
        </p>

        <dl class="exercise-modal__details">
          <div class="exercise-modal__detail">
            <dt>Target</dt>
            <dd data-modal-target></dd>
          </div>
          <div class="exercise-modal__detail">
            <dt>Body Part</dt>
            <dd data-modal-body-part></dd>
          </div>
          <div class="exercise-modal__detail">
            <dt>Equipment</dt>
            <dd data-modal-equipment></dd>
          </div>
          <div class="exercise-modal__detail">
            <dt>Popular</dt>
            <dd data-modal-popularity></dd>
          </div>
          <div class="exercise-modal__detail">
            <dt>Burned calories</dt>
            <dd data-modal-calories></dd>
          </div>
        </dl>

        <p class="exercise-modal__description" data-modal-description></p>

        <div class="exercise-modal__actions">
          <button
            class="ui-button exercise-modal__favorite"
            type="button"
            data-modal-favorite
          >
            <span data-modal-favorite-label>Add to favorites</span>
            <load
              src="components/icon/icon.html"
              src-url="./images/icons/heart.svg"
              label=""
            />
          </button>
        </div>

        <p
          class="exercise-modal__favorite-error"
          data-modal-favorite-error
          role="alert"
          hidden
        >
          Unable to update your favorites. Please try again.
        </p>
      </div>
    </div>
  </div>
</dialog>
